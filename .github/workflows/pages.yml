name: Deploy visage.moscow (Beget + GitHub Pages)

on:
  push:
    branches: ["main"]
    paths:
      - "03_Сайт_Исходники/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 1. Автоматическая выгрузка на Beget в ~/medical/public_html/
  deploy-beget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BEGET_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.BEGET_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to Beget via rsync
        run: |
          rsync -avz --delete \
            --exclude='cgi-bin' \
            --exclude='.well-known' \
            --exclude='.git*' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            "03_Сайт_Исходники/" \
            "${{ secrets.BEGET_USER }}@${{ secrets.BEGET_HOST }}:~/medical/public_html/"

  # 2. Параллельное обновление резервной копии на GitHub Pages
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "03_Сайт_Исходники"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4