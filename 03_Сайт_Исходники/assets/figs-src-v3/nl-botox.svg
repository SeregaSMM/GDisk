<svg viewBox="0 0 900 560" role="img" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="nbSkin" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#FAF1E8"/><stop offset="1" stop-color="#EFDCCD"/></radialGradient><marker id="nbArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#B4553A"/></marker></defs><g data-at="0.02"><path d="M430,150 C404,176 396,220 384,262 C374,300 372,330 386,348 C400,364 416,368 430,366 C444,368 460,364 474,348 C488,330 486,300 476,262 C464,220 456,176 430,150 Z" fill="url(#nbSkin)" stroke="#D3B29C" stroke-width="1.4"/></g><g data-at="0.06"><ellipse cx="408" cy="350" rx="16" ry="9" fill="#E5CFC0" stroke="#B8907A"/><ellipse cx="452" cy="350" rx="16" ry="9" fill="#E5CFC0" stroke="#B8907A"/></g><path d="M390,368 C372,404 364,446 360,492" fill="none" stroke="#D96B43" stroke-width="1.6" opacity=".5" data-at="0.12" data-draw="1" pathLength="100"/><path d="M470,368 C488,404 496,446 500,492" fill="none" stroke="#D96B43" stroke-width="1.6" opacity=".5" data-at="0.12" data-draw="1" pathLength="100"/><g data-at="0.14"><text x="430" y="512" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">НОСОГУБНАЯ СКЛАДКА</text></g><g data-at="0.24"><circle cx="526" cy="356" r="14" fill="none" stroke="#234233" stroke-width="1.6"/><circle cx="526" cy="356" r="4.5" fill="#234233"/><path d="M542,356 L580,356" stroke="#E6E1D6"/><text x="586" y="344" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8" font-weight="500" fill="#234233" text-anchor="start" letter-spacing=".08em">НИЖЕ У КРЫЛА НОСА</text></g><g data-at="0.26"><text x="586" y="358" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">расслабляет мышцу сильно:</text><text x="586" y="372" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">губа поднимается меньше</text></g><g data-at="0.38"><circle cx="474" cy="238" r="14" fill="none" stroke="#2F5643" stroke-width="1.6" stroke-dasharray="4 3"/><circle cx="474" cy="238" r="4.5" fill="#2F5643"/><path d="M488,238 L580,232" stroke="#E6E1D6"/><text x="586" y="222" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8" font-weight="500" fill="#2F5643" text-anchor="start" letter-spacing=".08em">ВЫШЕ, НА СКАТЕ НОСА</text></g><g data-at="0.40"><text x="586" y="236" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">мягче: убирает тягу,</text><text x="586" y="250" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">почти не трогая губу</text></g><g data-at="0.52"><circle cx="360" cy="432" r="11" fill="none" stroke="#B4553A" stroke-width="1.5"/><circle cx="360" cy="432" r="4" fill="#B4553A"/><circle cx="366" cy="472" r="11" fill="none" stroke="#B4553A" stroke-width="1.5"/><circle cx="366" cy="472" r="4" fill="#B4553A"/><path d="M346,452 L280,452" stroke="#E6E1D6"/><text x="274" y="440" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8" font-weight="500" fill="#B4553A" text-anchor="end" letter-spacing=".08em">ПО ХОДУ СКЛАДКИ</text></g><g data-at="0.54"><text x="274" y="454" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#5A655E" text-anchor="end" letter-spacing="0">самый осторожный вариант:</text><text x="274" y="468" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#5A655E" text-anchor="end" letter-spacing="0">эффект скромный, риск ниже</text></g><g data-at="0.64"><path d="M366,392 Q430,404 494,392" fill="none" stroke="#B4553A" stroke-width="1" stroke-dasharray="4 4"/><text x="430" y="388" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8" font-weight="500" fill="#B4553A" text-anchor="middle" letter-spacing=".08em">КРАСНАЯ КАЙМА — НЕ МЕСТО ДЛЯ УКОЛА</text></g><g data-at="0.72"><text x="34" y="546" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Речь об одной и той же мышце. Разница только в том, какую её часть расслабляют — и насколько.</text></g></svg>