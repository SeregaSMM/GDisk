<svg viewBox="0 0 940 420" role="img" xmlns="http://www.w3.org/2000/svg"><defs></defs><g data-at="0.02"><text x="40" y="44" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">ТРИ СЕМЕЙСТВА НИТЕЙ · РАЗНАЯ ЗАДАЧА</text></g><g data-at="0.04"><text x="40" y="66" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Нить — это не «подтяжка без операции». Разные нити решают разные задачи.</text></g><g data-at="0.1"><rect x="40" y="80" width="268" height="176" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/></g><g data-at="0.14"><line x1="86" y1="122" x2="262" y2="216" stroke="#234233" stroke-width="2"/><line x1="86.0" y1="117.0" x2="86.0" y2="127.0" stroke="#2F5643" stroke-width="1.2"/><line x1="108.0" y1="128.75" x2="108.0" y2="138.75" stroke="#2F5643" stroke-width="1.2"/><line x1="130.0" y1="140.5" x2="130.0" y2="150.5" stroke="#2F5643" stroke-width="1.2"/><line x1="152.0" y1="152.25" x2="152.0" y2="162.25" stroke="#2F5643" stroke-width="1.2"/><line x1="174.0" y1="164.0" x2="174.0" y2="174.0" stroke="#2F5643" stroke-width="1.2"/><line x1="196.0" y1="175.75" x2="196.0" y2="185.75" stroke="#2F5643" stroke-width="1.2"/><line x1="218.0" y1="187.5" x2="218.0" y2="197.5" stroke="#2F5643" stroke-width="1.2"/><line x1="240.0" y1="199.25" x2="240.0" y2="209.25" stroke="#2F5643" stroke-width="1.2"/><line x1="262.0" y1="211.0" x2="262.0" y2="221.0" stroke="#2F5643" stroke-width="1.2"/></g><g data-at="0.22"><text x="174" y="286" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="600" fill="#1C2420" text-anchor="middle" letter-spacing="0">Гладкая</text></g><g data-at="0.24000000000000002"><text x="174" y="306" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">армирование: сетка</text></g><g data-at="0.24000000000000002"><text x="174" y="321" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">под кожей, без объёма</text></g><g data-at="0.3"><rect x="330" y="80" width="268" height="176" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/></g><g data-at="0.33999999999999997"><path d="M376,122 L398,146 L420,140 L442,166 L464,161 L486,188 L508,182 L530,208 L552,203 " fill="none" stroke="#2F5643" stroke-width="2"/><path d="M376,128 L398,152 L420,146 L442,172 L464,167 L486,194 L508,188 L530,214 L552,209 " fill="none" stroke="#2F5643" stroke-width="2"/></g><g data-at="0.42"><text x="464" y="286" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="600" fill="#1C2420" text-anchor="middle" letter-spacing="0">Плетёная</text></g><g data-at="0.44"><text x="464" y="306" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">плотный каркас,</text></g><g data-at="0.44"><text x="464" y="321" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">больше точек сцепления</text></g><g data-at="0.5"><rect x="620" y="80" width="268" height="176" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/></g><g data-at="0.54"><line x1="666" y1="169" x2="842" y2="169" stroke="#234233" stroke-width="1.6"/><ellipse cx="676" cy="169" rx="10" ry="17" fill="none" stroke="#D96B43" stroke-width="1.6"/><ellipse cx="695" cy="169" rx="10" ry="17" fill="none" stroke="#D96B43" stroke-width="1.6"/><ellipse cx="714" cy="169" rx="10" ry="17" fill="none" stroke="#D96B43" stroke-width="1.6"/><ellipse cx="733" cy="169" rx="10" ry="17" fill="none" stroke="#D96B43" stroke-width="1.6"/><ellipse cx="752" cy="169" rx="10" ry="17" fill="none" stroke="#D96B43" stroke-width="1.6"/><ellipse cx=