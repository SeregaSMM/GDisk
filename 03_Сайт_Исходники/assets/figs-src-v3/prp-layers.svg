<svg viewBox="0 0 940 470" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="prArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#234233"/></marker></defs><g data-at="0.02"><text x="40" y="44" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">ЧТО ПРОИСХОДИТ С КРОВЬЮ В ПРОБИРКЕ</text></g><g data-at="0.04"><text x="40" y="66" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Кровь — это не жидкость одного цвета. Центрифуга разделяет её на слои по плотности.</text></g><g data-at="0.08"><rect x="300" y="96" width="130" height="330" rx="14" fill="#FAF7F2" stroke="#E6E1D6" stroke-width="1.5"/><path d="M300,426 q65.0,26 130,0" fill="none" stroke="#E6E1D6" stroke-width="1.5"/></g><g data-at="0.14"><rect x="303" y="99" width="124" height="120" rx="10" fill="#F0D77C" stroke="#D9BE5E"/></g><g data-at="0.26"><rect x="303" y="221" width="124" height="26" fill="#E7D9C0"/></g><g data-at="0.20"><rect x="303" y="249" width="124" height="174" rx="10" fill="#C4675C" stroke="#A95348"/></g><g data-at="0.30"><text x="365.0" y="150" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">ПЛАЗМА</text></g><g data-at="0.32"><text x="365.0" y="168" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">светлая, жидкая</text></g><g data-at="0.34"><text x="365.0" y="214" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="7.5" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">ТРОМБОЦИТЫ И ЛЕЙКОЦИТЫ</text></g><g data-at="0.26"><text x="365.0" y="300" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#F7E9E5" text-anchor="middle" letter-spacing=".08em">ЭРИТРОЦИТЫ</text></g><g data-at="0.28"><text x="365.0" y="318" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#F7E9E5" text-anchor="middle" letter-spacing="0">клетки-переносчики</text></g><g data-at="0.4"><line x1="448" y1="144" x2="486" y2="144" stroke="#E6E1D6" stroke-dasharray="3 4"/><text x="498" y="150" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="11" font-weight="600" fill="#1C2420" text-anchor="start" letter-spacing="0">Плазма — рабочий материал</text></g><g data-at="0.42000000000000004"><text x="498" y="166" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">именно её вводят в кожу</text></g><g data-at="0.48"><line x1="448" y1="234" x2="486" y2="234" stroke="#E6E1D6" stroke-dasharray="3 4"/><text x="498" y="240" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="11" font-weight="600" fill="#1C2420" text-anchor="start" letter-spacing="0">Тонкое кольцо — самое ценное</text></g><g data-at="0.5"><text x="498" y="256" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">в нём тромбоциты, а в них факторы роста</text></g><g data-at="0.56"><line x1="448" y1="324" x2="486" y2="324" stroke="#E6E1D6" stroke-dasharray="3 4"/><text x="498" y="330" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="11" font-weight="600" fill="#1C2420" text-anchor="start" letter-spacing="0">Эритроциты тяжелее всех</text></g><g data-at="0.5800000000000001"><text x="498" y="346" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">оседают вниз, в плазме их быть почти не должно</text></g><g data-at="0.10"><circle cx="160" cy="260" r="52" fill="none" stroke="#E6E1D6" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M160,206 a54,54 0 0 1 40,16" fill="none" stroke="#234233" stroke-width="2" marker-end="url(#prArr)"/><text x="160" y="268" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">ЦЕНТРИФУГА</text><text x="160" y="284" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">разделяет по весу</text></g><g data-at="0.66"><text x="40" y="434" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Чем аккуратнее разделение, тем меньше в плазме «лишних» клеток и тем предсказуемее результат.</text></g><g data-at="0.68"><text x="40" y="452" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Это одна из причин, почему у двух клиник с одинаковым названием процедуры получается разный эффект.</text></g></svg>