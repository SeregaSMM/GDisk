<svg viewBox="0 0 940 500" role="img" xmlns="http://www.w3.org/2000/svg"><defs></defs><g data-at="0.02"><text x="40" y="44" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">ОДИН СРЕЗ · ТРИ РАЗНЫЕ ГЛУБИНЫ</text></g><g data-at="0.04"><text x="40" y="66" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Чем глубже цель, тем важнее способ доставки. Крем и игла решают разные задачи.</text></g><g data-at="0.08"><rect x="180" y="150" width="540" height="62" fill="#EFE3D2" stroke="#CDBBA2"/></g><g data-at="0.12"><rect x="180" y="212" width="540" height="180" fill="#F0DED2" stroke="#D3B29C"/></g><g data-at="0.16"><rect x="180" y="392" width="540" height="94" fill="#F4E6C6" stroke="#DCC49A"/></g><g data-at="0.20"><text x="194" y="176" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#5A655E" text-anchor="start" letter-spacing=".08em">ЭПИДЕРМИС</text><text x="194" y="194" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">здесь нет сосудов и нет фибробластов</text></g><g data-at="0.24"><text x="194" y="242" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#5A655E" text-anchor="start" letter-spacing=".08em">ДЕРМА</text><text x="194" y="260" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">коллаген, эластин, фибробласты</text></g><g data-at="0.28"><text x="194" y="422" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#5A655E" text-anchor="start" letter-spacing=".08em">ГИПОДЕРМА</text><text x="194" y="440" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">жир, крупные сосуды, нервы</text></g><g data-at="0.34"><ellipse cx="300" cy="250" rx="13" ry="8" fill="#C99B81"/><path d="M280,250 L287,250" stroke="#C99B81" stroke-width="1.6"/><path d="M313,250 L320,250" stroke="#C99B81" stroke-width="1.6"/></g><g data-at="0.37"><ellipse cx="420" cy="300" rx="13" ry="8" fill="#C99B81"/><path d="M400,300 L407,300" stroke="#C99B81" stroke-width="1.6"/><path d="M433,300 L440,300" stroke="#C99B81" stroke-width="1.6"/></g><g data-at="0.4"><ellipse cx="540" cy="232" rx="13" ry="8" fill="#C99B81"/><path d="M520,232 L527,232" stroke="#C99B81" stroke-width="1.6"/><path d="M553,232 L560,232" stroke="#C99B81" stroke-width="1.6"/></g><g data-at="0.43000000000000005"><ellipse cx="610" cy="316" rx="13" ry="8" fill="#C99B81"/><path d="M590,316 L597,316" stroke="#C99B81" stroke-width="1.6"/><path d="M623,316 L630,316" stroke="#C99B81" stroke-width="1.6"/></g><g data-at="0.44"><ellipse cx="250" cy="144" rx="46" ry="12" fill="#C9D8CE" stroke="#5C7A66" stroke-width="1.2"/><text x="250" y="120" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#5C7A66" text-anchor="middle" letter-spacing=".08em">КРЕМ</text><text x="250" y="136" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">остаётся наверху</text></g><g data-at="0.54"><path d="M540,60 L540,286" stroke="#234233" stroke-width="2.4"/><path d="M534,284 L540,298 L546,284" fill="#234233"/><text x="556" y="74" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#234233" text-anchor="start" letter-spacing=".08em">ИНЪЕКЦИЯ</text><text x="556" y="90" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">доставляет в дерму</text></g><g data-at="0.60"><line x1="160" y1="150" x2="740" y2="150" stroke="#5A655E" stroke-width="1.4"/><text x="746" y="154" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8" font-weight="500" fill="#5A655E" text-anchor="start" letter-spacing=".08em">ПОВЕРХНОСТЬ</text></g><g data-at="0.70"><text x="40" y="460" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Фибробласты живут в дерме и на границе с гиподермой. Если активное вещество осталось в роговом слое, оно просто не встретится с ними.</text></g></svg>