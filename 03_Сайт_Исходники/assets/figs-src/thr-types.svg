<svg viewBox="0 0 940 470" role="img" xmlns="http://www.w3.org/2000/svg"><defs></defs><g data-at="0.02"><text x="40" y="44" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">ТРИ СЕМЕЙСТВА НИТЕЙ · РАЗНАЯ ЗАДАЧА</text></g><g data-at="0.04"><text x="40" y="66" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Нить — это не «подтяжка без операции». Разные нити решают разные задачи.</text></g><g data-at="0.1"><rect x="40" y="86" width="268" height="196" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/></g><g data-at="0.14"><line x1="86" y1="130" x2="262" y2="224" stroke="#234233" stroke-width="2"/><line x1="86.0" y1="125.0" x2="86.0" y2="135.0" stroke="#2F5643" stroke-width="1.2"/><line x1="108.0" y1="136.75" x2="108.0" y2="146.75" stroke="#2F5643" stroke-width="1.2"/><line x1="130.0" y1="148.5" x2="130.0" y2="158.5" stroke="#2F5643" stroke-width="1.2"/><line x1="152.0" y1="160.25" x2="152.0" y2="170.25" stroke="#2F5643" stroke-width="1.2"/><line x1="174.0" y1="172.0" x2="174.0" y2="182.0" stroke="#2F5643" stroke-width="1.2"/><line x1="196.0" y1="183.75" x2="196.0" y2="193.75" stroke="#2F5643" stroke-width="1.2"/><line x1="218.0" y1="195.5" x2="218.0" y2="205.5" stroke="#2F5643" stroke-width="1.2"/><line x1="240.0" y1="207.25" x2="240.0" y2="217.25" stroke="#2F5643" stroke-width="1.2"/><line x1="262.0" y1="219.0" x2="262.0" y2="229.0" stroke="#2F5643" stroke-width="1.2"/></g><g data-at="0.22"><text x="174" y="310" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="600" fill="#1C2420" text-anchor="middle" letter-spacing="0">Гладкая</text></g><g data-at="0.24000000000000002"><text x="174" y="330" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">армирование: сетка</text></g><g data-at="0.24000000000000002"><text x="174" y="345" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">под кожей, без объёма</text></g><g data-at="0.3"><rect x="330" y="86" width="268" height="196" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/></g><g data-at="0.33999999999999997"><path d="M376,130 L398,154 L420,148 L442,174 L464,169 L486,196 L508,190 L530,216 L552,211 " fill="none" stroke="#2F5643" stroke-width="2"/><path d="M376,136 L398,160 L420,154 L442,180 L464,175 L486,202 L508,196 L530,222 L552,217 " fill="none" stroke="#2F5643" stroke-width="2"/></g><g data-at="0.42"><text x="464" y="310" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="12.5" font-weight="600" fill="#1C2420" text-anchor="middle" letter-spacing="0">Плетёная</text></g><g data-at="0.44"><text x="464" y="330" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">плотный каркас,</text></g><g data-at="0.44"><text x="464" y="345" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">больше точек сцепления</text></g><g data-at="0.5"><rect x="620" y="86" width="268" height="196" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/></g><g data-at="0.54"><line x1="666" y1="177" x2="842" y2="177" stroke="#234233" stroke-width="1.6"/><ellipse cx="676" cy="177" rx="10" ry="17" fill="none" stroke="#D96B43" stroke-width="1.6"/><ellipse cx="695" cy="177" rx="10" ry="17" fill="none" stroke="#D96B43" stroke-width="1.6"/><ellipse cx="714" cy="177" rx="10" ry="17" fill="none" stroke="#D96B43" stroke-width="1.6"/><ellipse cx="733" cy="177" rx="10" ry="17" fill="none" stroke="#D96B43" stroke-width="1.6"/><ellipse cx="752" cy="177" rx="10" ry="17" fill="none" stroke="#D96B43" stroke-width="1.6"/><ellipse cx=