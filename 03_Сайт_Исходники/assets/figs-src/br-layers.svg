<svg viewBox="0 0 940 560" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="brArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#D96B43"/></marker></defs><g data-at="0.02"><text x="40" y="44" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">ПЯТЬ СЛОЁВ · ОДИН ПУТЬ НАВЕРХ</text></g><g data-at="0.04"><text x="40" y="66" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Эпидермис обновляется целиком: клетка рождается внизу и умирает наверху.</text></g><g data-at="0.08"><rect x="90" y="428" width="510" height="12" rx="5" fill="#C9A78C"/></g><g data-at="0.10"><text x="90" y="458" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#5A655E" text-anchor="start" letter-spacing=".08em">БАЗАЛЬНАЯ МЕМБРАНА — ГРАНИЦА С ДЕРМОЙ</text></g><g data-at="0.1"><rect x="90" y="372" width="510" height="92" fill="#E8DFD0" stroke="#D3B29C" stroke-width=".9"/></g><g data-at="0.13"><text x="106" y="421.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#5A655E" text-anchor="start" letter-spacing=".08em">РОГОВОЙ</text></g><g data-at="0.14"><text x="106" y="437.0" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">мёртвые чешуйки, кератин</text></g><g data-at="0.18"><rect x="90" y="340" width="510" height="32" fill="#F1E9DB" stroke="#D3B29C" stroke-width=".9"/></g><g data-at="0.21"><text x="106" y="359.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#5A655E" text-anchor="start" letter-spacing=".08em">БЛЕСТЯЩИЙ</text></g><g data-at="0.22"><text x="106" y="375.0" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">только на ладонях и стопах</text></g><g data-at="0.26"><rect x="90" y="300" width="510" height="40" fill="#EADFCB" stroke="#D3B29C" stroke-width=".9"/></g><g data-at="0.29000000000000004"><text x="106" y="323.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#5A655E" text-anchor="start" letter-spacing=".08em">ЗЕРНИСТЫЙ</text></g><g data-at="0.3"><text x="106" y="339.0" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">клетки теряют ядро</text></g><g data-at="0.34"><rect x="90" y="240" width="510" height="60" fill="#F0DED2" stroke="#D3B29C" stroke-width=".9"/></g><g data-at="0.37"><text x="106" y="273.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#5A655E" text-anchor="start" letter-spacing=".08em">ШИПОВАТЫЙ</text></g><g data-at="0.38"><text x="106" y="289.0" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">клетки сцеплены мостиками</text></g><g data-at="0.42"><rect x="90" y="200" width="510" height="40" fill="#E5C9B8" stroke="#D3B29C" stroke-width=".9"/></g><g data-at="0.44999999999999996"><text x="106" y="223.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#5A655E" text-anchor="start" letter-spacing=".08em">БАЗАЛЬНЫЙ</text></g><g data-at="0.45999999999999996"><text x="106" y="239.0" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">здесь клетки делятся</text></g><g data-at="0.46"><ellipse cx="150" cy="218" rx="13" ry="12" fill="#C99B81" opacity=".85"/><ellipse cx="150" cy="266" 