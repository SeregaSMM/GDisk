<svg viewBox="0 0 940 420" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="snArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#5A655E"/></marker></defs><g data-at="0.02"><text x="40" y="44" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">ЦВЕТ СИНЯКА — ЭТО ХИМИЯ, А НЕ «СТАДИЯ ЗАЖИВЛЕНИЯ»</text></g><g data-at="0.04"><text x="40" y="66" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Гемоглобин распадается постепенно, и на каждом шаге меняет цвет. Отсюда радуга на коже.</text></g><g data-at="0.1"><rect x="40" y="124" width="156" height="132" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/><circle cx="118.0" cy="172" r="26" fill="#D8412F"/><text x="118.0" y="212" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="7.5" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">ОКСИГЕМОГЛОБИН</text><text x="118.0" y="234" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="600" fill="#1C2420" text-anchor="middle" letter-spacing="0">ярко-красный</text><text x="118.0" y="252" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">сразу после травмы</text></g><g data-at="0.14"><path d="M199,170 L213,170" stroke="#5A655E" stroke-width="1.4" marker-end="url(#snArr)"/></g><g data-at="0.19"><rect x="218" y="124" width="156" height="132" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/><circle cx="296.0" cy="172" r="26" fill="#7C4A8C"/><text x="296.0" y="212" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="7.5" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">ДЕЗОКСИГЕМОГЛОБИН</text><text x="296.0" y="234" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="600" fill="#1C2420" text-anchor="middle" letter-spacing="0">сине-багровый</text><text x="296.0" y="252" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">1–2 дня</text></g><g data-at="0.23"><path d="M377,170 L391,170" stroke="#5A655E" stroke-width="1.4" marker-end="url(#snArr)"/></g><g data-at="0.28"><rect x="396" y="124" width="156" height="132" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/><circle cx="474.0" cy="172" r="26" fill="#5E7A4A"/><text x="474.0" y="212" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="7.5" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">МЕТГЕМОГЛОБИН</text><text x="474.0" y="234" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="600" fill="#1C2420" text-anchor="middle" letter-spacing="0">зеленоватый</text><text x="474.0" y="252" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">3–5 дней</text></g><g data-at="0.32"><path d="M555,170 L569,170" stroke="#5A655E" stroke-width="1.4" marker-end="url(#snArr)"/></g><g data-at="0.37"><rect x="574" y="124" width="156" height="132" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/><circle cx="652.0" cy="172" r="26" fill="#3F6B3A"/><text x="652.0" y="212" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="7.5" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">БИЛИВЕРДИН</text><text x="652.0" y="234" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="600" fill="#1C2420" text-anchor="middle" letter-spacing="0">тёмно-зелёный</text><text x="652.0" y="252" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">5–7 дней</text></g><g data-at="0.41000000000000003"><path d="M733,170 L747,170" stroke="#5A655E" stroke-width="1.4" marker-end="url(#snArr)"/></g><g data-at="0.45999999999999996"><rect x="752" y="124" width="156" height="132" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/><circle cx="830.0" cy="172" r="26" fill="#C9A227"/><text x="830.0" y="212" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="7.5" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">БИЛИРУБИН</text><text x="830.0" y="234" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="600" fill="#1C2420" text-anchor="middle" letter-spacing="0">жёлтый</text><text x="830.0" y="252" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">7–14 дней</text></g><g data-at="0.62"><rect x="40" y="300" width="860" height="72" rx="12" fill="#FBF3E6" stroke="#E6E1D6"/><text x="58" y="322" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">ГДЕ ЭТО ПРОИСХОДИТ</text><text x="58" y="344" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">В дерме и подкожном жире. Глубокий синяк первые дни может быть не виден:</text><text x="58" y="360" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">кожа над ним выглядит обычно, а «проявляется» он позже — когда продукты распада поднимаются выше.</text></g></svg>