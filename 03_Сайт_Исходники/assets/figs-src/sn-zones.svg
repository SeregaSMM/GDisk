<svg viewBox="0 0 940 560" role="img" xmlns="http://www.w3.org/2000/svg"><defs></defs><g data-at="0.02"><text x="40" y="44" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">ГДЕ СИНЯКИ ПОЯВЛЯЮТСЯ ЧАЩЕ ВСЕГО</text></g><g data-at="0.04"><text x="40" y="66" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Чем тоньше кожа и богаче сосудистая сеть, тем заметнее любая капля крови.</text></g><g data-at="0.06"><path d="M330,70 C442,70 490,178 490,276 C490,386 438,480 330,500 C222,480 170,386 170,276 C170,178 218,70 330,70 Z" fill="#FAF1EA" stroke="#D3B29C" stroke-width="1.4"/></g><g data-at="0.10"><ellipse cx="272" cy="214" rx="30" ry="15" fill="none" stroke="#B8907A" stroke-width="1.2"/><ellipse cx="388" cy="214" rx="30" ry="15" fill="none" stroke="#B8907A" stroke-width="1.2"/><path d="M330,240 L320,304 Q330,314 342,304" fill="none" stroke="#B8907A" stroke-width="1.1"/><path d="M296,366 Q330,356 364,366 Q330,394 296,366" fill="#E3B9AE" stroke="#B8907A" stroke-width="1"/></g><g data-at="0.18"><circle cx="212" cy="178" r="30" fill="#B4553A" opacity=".16"/><circle cx="212" cy="178" r="17" fill="#B4553A" opacity=".26"/></g><g data-at="0.26"><circle cx="330" cy="152" r="30" fill="#B4553A" opacity=".16"/><circle cx="330" cy="152" r="17" fill="#B4553A" opacity=".26"/></g><g data-at="0.34"><circle cx="330" cy="374" r="30" fill="#B4553A" opacity=".16"/><circle cx="330" cy="374" r="17" fill="#B4553A" opacity=".26"/></g><g data-at="0.42"><circle cx="330" cy="118" r="30" fill="#B4553A" opacity=".16"/><circle cx="330" cy="118" r="17" fill="#B4553A" opacity=".26"/></g><g data-at="0.5"><line x1="498" y1="194" x2="600" y2="194" stroke="#E6E1D6" stroke-dasharray="3 4"/><text x="614" y="200" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="11" font-weight="600" fill="#1C2420" text-anchor="start" letter-spacing="0">Периорбитальная зона</text></g><g data-at="0.52"><text x="614" y="216" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">самая частая и самая заметная</text></g><g data-at="0.56"><line x1="498" y1="146" x2="600" y2="146" stroke="#E6E1D6" stroke-dasharray="3 4"/><text x="614" y="152" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="11" font-weight="600" fill="#1C2420" text-anchor="start" letter-spacing="0">Межбровье и лоб</text></g><g data-at="0.5800000000000001"><text x="614" y="168" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">сосуды у самой поверхности</text></g><g data-at="0.62"><line x1="498" y1="374" x2="600" y2="374" stroke="#E6E1D6" stroke-dasharray="3 4"/><text x="614" y="380" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="11" font-weight="600" fill="#1C2420" text-anchor="start" letter-spacing="0">Губы и углы рта</text></g><g data-at="0.64"><text x="614" y="396" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">обильное кровоснабжение</text></g><g data-at="0.68"><line x1="498" y1="440" x2="600" y2="440" stroke="#E6E1D6" stroke-dasharray="3 4"/><text x="614" y="446" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="11" font-weight="600" fill="#1C2420" text-anchor="start" letter-spacing="0">Подкожный жир</text></g><g data-at="0.7000000000000001"><text x="614" y="462" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">глубокий синяк всплывает позже</text></g><g data-at="0.76"><text x="40" y="528" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Это не «плохие зоны», а просто анатомия. Знание помогает не удивляться и не считать синяк ошибкой врача.</text></g></svg>