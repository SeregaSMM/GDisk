<svg viewBox="0 0 940 480" role="img" xmlns="http://www.w3.org/2000/svg"><defs></defs><g data-at="0.02"><text x="40" y="44" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">ТРИ РАЗНЫХ СПОСОБА · ТРИ РАЗНЫХ РЕЗУЛЬТАТА</text></g><g data-at="0.04"><text x="40" y="66" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Выбор начинается не с препарата, а с вопроса: чего именно не хватает?</text></g><g data-at="0.1"><rect x="40" y="90" width="268" height="268" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/></g><g data-at="0.13"><rect x="40" y="90" width="268" height="4" rx="2" fill="#234233"/></g><g data-at="0.15000000000000002"><text x="58" y="122" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="12" font-weight="600" fill="#1C2420" text-anchor="start" letter-spacing="0">Расслабить мышцу</text></g><g data-at="0.18"><ellipse cx="174" cy="170" rx="46" ry="16" fill="#D9B9A4" stroke="#B8907A" stroke-width="1.2"/><path d="M104,170 L122,170" stroke="#234233" stroke-width="2"/><path d="M226,170 L244,170" stroke="#234233" stroke-width="2" opacity=".4"/></g><g data-at="0.22"><text x="58" y="228" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#234233" text-anchor="start" letter-spacing="0">ботулотоксин</text></g><g data-at="0.24000000000000002"><text x="58" y="252" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8" font-weight="500" fill="#5A655E" text-anchor="start" letter-spacing=".08em">ЧТО ДАЁТ</text></g><g data-at="0.26"><text x="58" y="270" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">снимает тягу, которая</text></g><g data-at="0.26"><text x="58" y="285" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">формирует перепад</text></g><g data-at="0.28"><text x="58" y="308" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8" font-weight="500" fill="#B4553A" text-anchor="start" letter-spacing=".08em">ЧЕГО НЕ ДЕЛАЕТ</text></g><g data-at="0.30000000000000004"><text x="58" y="326" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">не добавит объёма</text></g><g data-at="0.30000000000000004"><text x="58" y="341" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">и не разгладит кожу</text></g><g data-at="0.3"><rect x="330" y="90" width="268" height="268" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/></g><g data-at="0.32999999999999996"><rect x="330" y="90" width="268" height="4" rx="2" fill="#D96B43"/></g><g data-at="0.35"><text x="348" y="122" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="12" font-weight="600" fill="#1C2420" text-anchor="start" letter-spacing="0">Восстановить опору</text></g><g data-at="0.38"><ellipse cx="464" cy="170" rx="40" ry="26" fill="#C9D8CE" stroke="#5C7A66" stroke-width="1.3"/><ellipse cx="464" cy="170" rx="16" ry="9" fill="#fff" opacity=".5"/></g><g data-at="0.42"><text x="348" y="228" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#D96B43" text-anchor="start" letter-spacing="0">филлер</text></g><g data-at="0.44"><text x="348" y="252" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8" font-weight="500" fill="#5A655E" text-anchor="start" letter-spacing=".08em">ЧТО ДАЁТ</text></g><g data-at="0.45999999999999996"><text x="348" y="270" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">возвращает объём там,</text></g><g data-at="0.45999999999999996"><text x="348" y="285" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">где просела кость</text></g><g data-at="0.48"><text x="348" y="308" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8" font-weight="500" fill="#B4553A" text-anchor="start" letter-spacing=".08em">ЧЕГО НЕ ДЕЛАЕТ</text></g><g data-at="0.5"><text x="348" y="326" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">не работает против</text></g><g data-at="0.5"><text x="348" y="341" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">мышцы и гравитации</text></g><g data-at="0.5"><rect x="620" y="90" width="268" height="268" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/></g><g data-at="0.53"><rect x="620" y="90" width="268" height="4" rx="2" fill="#5C7A66"/></g><g data-at="0.55"><text x="638" y="122" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="12" font-weight="600" fill="#1C2420" text-anchor="start" letter-spacing="0">Укрепить каркас</text></g><g data-at="0.58"><path d="M720,148 L740,192" stroke="#5C7A66" stroke-width="2" stroke-linecap="round"/><path d="M754,148 L774,192" stroke="#5C7A66" stroke-width="2" stroke-linecap="round"/><path d="M788,148 L808,192" stroke="#5C7A66" stroke-width="2" stroke-linecap="round"/><path d="M708,170 L800,170" stroke="#5C7A66" stroke-width="2" stroke-linecap="round" opacity=".5"/></g><g data-at="0.62"><text x="638" y="228" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5C7A66" text-anchor="start" letter-spacing="0">нити, аппаратные методики</text></g><g data-at="0.64"><text x="638" y="252" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8" font-weight="500" fill="#5A655E" text-anchor="start" letter-spacing=".08em">ЧТО ДАЁТ</text></g><g data-at="0.66"><text x="638" y="270" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">уплотняет ткань,</text></g><g data-at="0.66"><text x="638" y="285" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">держит от провисания</text></g><g data-at="0.6799999999999999"><text x="638" y="308" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8" font-weight="500" fill="#B4553A" text-anchor="start" letter-spacing=".08em">ЧЕГО НЕ ДЕЛАЕТ</text></g><g data-at="0.7"><text x="638" y="326" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">не заменяет объём</text></g><g data-at="0.7"><text x="638" y="341" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">и не убирает тягу</text></g><g data-at="0.72"><text x="40" y="448" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Работающая тактика почти всегда составная и почти всегда разнесена во времени. Обещание «всё одним уколом» — маркер некомпетентности, а не смелости.</text></g></svg>