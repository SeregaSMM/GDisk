<svg viewBox="0 0 940 520" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="agArr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#B4553A"/></marker></defs><g data-at="0.02"><text x="40" y="44" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">ЖИР НЕ РАССАСЫВАЕТСЯ — ОН СПОЛЗАЕТ</text></g><g data-at="0.04"><text x="40" y="66" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Пакеты жира на щеке смещаются вниз и внутрь. Отсюда складки, брыли и «второй подбородок».</text></g><g data-at="0.06"><path d="M330,50 C445,50 495,160 495,260 C495,370 440,465 330,485 C220,465 165,370 165,260 C165,160 215,50 330,50 Z" fill="#F2E1D5" stroke="#D3B29C" stroke-width="1.4"/></g><g data-at="0.08"><path d="M330,210 L316,290 Q330,302 346,290" fill="none" stroke="#D3B29C" stroke-width="1.2"/></g><path d="M300,296 Q276,370 272,426" fill="none" stroke="#B4553A" stroke-width="1.4" opacity=".5" data-at="0.12" data-draw="1" pathLength="100"/><path d="M360,296 Q384,370 388,426" fill="none" stroke="#B4553A" stroke-width="1.4" opacity=".5" data-at="0.12" data-draw="1" pathLength="100"/><g data-at="0.24"><ellipse cx="276" cy="294" rx="42" ry="26" fill="none" stroke="#5A655E" stroke-width="1" stroke-dasharray="4 4" opacity=".65"/><ellipse cx="276" cy="320" rx="42" ry="26" fill="#F4E6C6" stroke="#DCC49A" stroke-width="1.2"/></g><g data-at="0.27"><path d="M276,350 L276,392" stroke="#B4553A" stroke-width="1.8" marker-end="url(#agArr2)"/></g><g data-at="0.32"><ellipse cx="238" cy="204" rx="42" ry="26" fill="none" stroke="#5A655E" stroke-width="1" stroke-dasharray="4 4" opacity=".65"/><ellipse cx="238" cy="230" rx="42" ry="26" fill="#F4E6C6" stroke="#DCC49A" stroke-width="1.2"/></g><g data-at="0.35"><path d="M238,260 L238,302" stroke="#B4553A" stroke-width="1.8" marker-end="url(#agArr2)"/></g><g data-at="0.4"><ellipse cx="408" cy="198" rx="42" ry="26" fill="none" stroke="#5A655E" stroke-width="1" stroke-dasharray="4 4" opacity=".65"/><ellipse cx="408" cy="224" rx="42" ry="26" fill="#F4E6C6" stroke="#DCC49A" stroke-width="1.2"/></g><g data-at="0.43000000000000005"><path d="M408,254 L408,296" stroke="#B4553A" stroke-width="1.8" marker-end="url(#agArr2)"/></g><g data-at="0.52"><line x1="500" y1="340" x2="620" y2="340" stroke="#E6E1D6" stroke-dasharray="3 4"/><text x="632" y="346" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="11.5" font-weight="600" fill="#1C2420" text-anchor="start" letter-spacing="0">овал «поплыл»</text></g><g data-at="0.54"><text x="632" y="362" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">тяжёлая нижняя треть, брыли</text></g><g data-at="0.58"><line x1="500" y1="270" x2="620" y2="270" stroke="#E6E1D6" stroke-dasharray="3 4"/><text x="632" y="276" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="11.5" font-weight="600" fill="#1C2420" text-anchor="start" letter-spacing="0">складка углубилась</text></g><g data-at="0.6"><text x="632" y="292" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">валик нависает над линией</text></g><g data-at="0.64"><line x1="500" y1="200" x2="620" y2="200" stroke="#E6E1D6" stroke-dasharray="3 4"/><text x="632" y="206" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="11.5" font-weight="600" fill="#1C2420" text-anchor="start" letter-spacing="0">скула опустела</text></g><g data-at="0.66"><text x="632" y="222" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">объём ушёл вниз, щека плоская</text></g><g data-at="0.72"><text x="40" y="496" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Пунктиром показано, где пакет лежал в молодости. Вернуть его на место «массажем» нельзя — можно только поддержать или восполнить объём.</text></g></svg>