<svg viewBox="0 0 940 440" role="img" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="thSkin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2E1D5"/><stop offset="1" stop-color="#E6CCBC"/></linearGradient><linearGradient id="thSkin2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2E1D5"/><stop offset="1" stop-color="#E6CCBC"/></linearGradient><marker id="thArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#D96B43"/></marker></defs><g data-at="0.02"><text x="46" y="44" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#234233" text-anchor="start" letter-spacing=".08em">АРМИРОВАНИЕ</text></g><g data-at="0.02"><text x="506" y="44" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">ВОЛЮМИЗАЦИЯ</text></g><g data-at="0.06"><rect x="46" y="62" width="420" height="268" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/></g><g data-at="0.10"><path d="M62,240 L152,240 L188,170 L224,240 L452,240 L452,300 L62,300 Z" fill="url(#thSkin)" stroke="#D3B29C" stroke-width="1"/></g><path d="M62,240 L152,240 L188,170 L224,240 L452,240" fill="none" stroke="#234233" stroke-width="2" data-at="0.12" data-draw="1" pathLength="100"/><g data-at="0.22"><path d="M120,258 L188,196" stroke="#5C7A66" stroke-width="3" stroke-linecap="round"/><path d="M110,206 L210,252" stroke="#5C7A66" stroke-width="3" stroke-linecap="round" opacity=".75"/></g><g data-at="0.26"><path d="M200,258 L228,196" stroke="#5C7A66" stroke-width="3" stroke-linecap="round"/><path d="M192,206 L232,252" stroke="#5C7A66" stroke-width="3" stroke-linecap="round" opacity=".75"/></g><g data-at="0.3"><path d="M280,258 L268,196" stroke="#5C7A66" stroke-width="3" stroke-linecap="round"/><path d="M274,206 L254,252" stroke="#5C7A66" stroke-width="3" stroke-linecap="round" opacity=".75"/></g><g data-at="0.33999999999999997"><path d="M360,258 L308,196" stroke="#5C7A66" stroke-width="3" stroke-linecap="round"/><path d="M356,206 L276,252" stroke="#5C7A66" stroke-width="3" stroke-linecap="round" opacity=".75"/></g><g data-at="0.44"><text x="62" y="316" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">сетка держит кожу от повторного складывания</text></g><g data-at="0.08"><rect x="506" y="62" width="420" height="268" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/></g><g data-at="0.14"><path d="M522,240 L612,240 L648,170 L684,240 L912,240 L912,300 L522,300 Z" fill="url(#thSkin2)" stroke="#D3B29C" stroke-width="1"/></g><path d="M522,240 L612,240 L648,170 L684,240 L912,240" fill="none" stroke="#234233" stroke-width="2" data-at="0.16" data-draw="1" pathLength="100"/><g data-at="0.30"><ellipse cx="660" cy="252" rx="58" ry="26" fill="#C9D8CE" stroke="#5C7A66" stroke-width="1.4"/></g><g data-at="0.34"><path d="M660,226 L660,190" stroke="#D96B43" stroke-width="1.8" marker-end="url(#thArr)"/></g><g data-at="0.40"><text x="522" y="316" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">объём приподнимает кожу изнутри</text></g><g data-at="0.60"><text x="46" y="364" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Армирование отвечает на вопрос «чтобы не складывалось». Волюмизация — «чтобы было чем держать».</text></g><g data-at="0.64"><text x="46" y="384" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Поэтому при выраженном дефиците объёма нити-сетка работают хуже: держать нечего, и каркас просто фиксирует пустоту.</text></g><g data-at="0.68"><text x="46" y="412" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Обратное тоже верно: объём без поддержки сползает быстрее.</text></g></svg>