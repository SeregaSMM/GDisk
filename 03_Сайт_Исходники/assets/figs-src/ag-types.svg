<svg viewBox="0 0 940 400" role="img" xmlns="http://www.w3.org/2000/svg"><defs></defs><g data-at="0.02"><text x="40" y="44" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">ТРИ СЦЕНАРИЯ СТАРЕНИЯ · ТИП ОПРЕДЕЛЯЕТ ТАКТИКУ</text></g><g data-at="0.04"><text x="40" y="66" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Одинаковый возраст выглядит по-разному: у кого-то сетка морщин, у кого-то «поплывший» овал.</text></g><g data-at="0.1"><rect x="40" y="74" width="268" height="218" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/></g><g data-at="0.14"><ellipse cx="174" cy="176" rx="62" ry="84" fill="#F2E1D5" stroke="#D3B29C" stroke-width="1.2"/><path d="M128,210 Q174,266 220,210" fill="none" stroke="#D3B29C" stroke-width="1"/></g><g data-at="0.16"><path d="M120,120 q14,-5 28,0" fill="none" stroke="#B8907A" stroke-width=".9"/><path d="M200,120 q14,-5 28,0" fill="none" stroke="#B8907A" stroke-width=".9"/></g><g data-at="0.17"><path d="M120,134 q14,-5 28,0" fill="none" stroke="#B8907A" stroke-width=".9"/><path d="M200,134 q14,-5 28,0" fill="none" stroke="#B8907A" stroke-width=".9"/></g><g data-at="0.18"><path d="M120,148 q14,-5 28,0" fill="none" stroke="#B8907A" stroke-width=".9"/><path d="M200,148 q14,-5 28,0" fill="none" stroke="#B8907A" stroke-width=".9"/></g><g data-at="0.19"><path d="M120,162 q14,-5 28,0" fill="none" stroke="#B8907A" stroke-width=".9"/><path d="M200,162 q14,-5 28,0" fill="none" stroke="#B8907A" stroke-width=".9"/></g><g data-at="0.2"><path d="M120,176 q14,-5 28,0" fill="none" stroke="#B8907A" stroke-width=".9"/><path d="M200,176 q14,-5 28,0" fill="none" stroke="#B8907A" stroke-width=".9"/></g><g data-at="0.21000000000000002"><path d="M120,190 q14,-5 28,0" fill="none" stroke="#B8907A" stroke-width=".9"/><path d="M200,190 q14,-5 28,0" fill="none" stroke="#B8907A" stroke-width=".9"/></g><g data-at="0.22"><path d="M120,204 q14,-5 28,0" fill="none" stroke="#B8907A" stroke-width=".9"/><path d="M200,204 q14,-5 28,0" fill="none" stroke="#B8907A" stroke-width=".9"/></g><g data-at="0.28"><path d="M134,148 q10,-8 20,0" fill="none" stroke="#D96B43" stroke-width="1.3"/><path d="M194,148 q10,-8 20,0" fill="none" stroke="#D96B43" stroke-width="1.3"/></g><g data-at="0.30000000000000004"><text x="174" y="322" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="12" font-weight="600" fill="#1C2420" text-anchor="middle" letter-spacing="0">Мелкоморщинистый</text></g><g data-at="0.32"><text x="174" y="342" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">тонкая сухая кожа, густая сетка</text></g><g data-at="0.32"><text x="174" y="357" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">линий, форма лица держится</text></g><g data-at="0.28"><rect x="330" y="74" width="268" height="218" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/></g><g data-at="0.32"><ellipse cx="464" cy="176" rx="62" ry="84" fill="#F2E1D5" stroke="#D3B29C" stroke-width="1.2"/><path d="M418,210 Q464,266 510,210" fill="none" stroke="#D3B29C" stroke-width="1"/></g><g data-at="0.38"><path d="M406,208 q10,34 26,44" fill="none" stroke="#B4553A" stroke-width="2"/><path d="M522,208 q-10,34 -26,44" fill="none" stroke="#B4553A" stroke-width="2"/></g><g data-at="0.42000000000000004"><path d="M434,240 q14,10 28,0" fill="none" stroke="#B4553A" stroke-width="1.2" stroke-dasharray="4 3"/></g><g data-at="0.44000000000000006"><path d="M420,186 q4,30 16,40" fill="none" stroke="#B8907A" stroke-width="1.2"/><path d="M508,186 q-4,30 -16,40" fill="none" stroke="#B8907A" stroke-width="1.2"/></g><g data-at="0.48000000000000004"><text x="464" y="322" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="12" font-weight="600" fill="#1C2420" text-anchor="middle" letter-spacing="0">Деформационный</text></g><g data-at="0.5"><text x="464" y="342" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">кожа плотная, но овал тяжёлый,</text></g><g data-at="0.5"><text x="464" y="357" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">брыли и отёчность, складки глубокие</text></g><g data-at="0.46"><rect x="620" y="74" width="268" height="218" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/></g><g data-at="0.5"><ellipse cx="754" cy="176" rx="62" ry="84" fill="#F2E1D5" stroke="#D3B29C" stroke-width="1.2"/><path d="M708,210 Q754,266 800,210" fill="none" stroke="#D3B29C" stroke-width="1"/></g><g data-at="0.56"><ellipse cx="724" cy="152" rx="16" ry="10" fill="#E6D2C4"/><ellipse cx="784" cy="152" rx="16" ry="10" fill="#E6D2C4"/></g><g data-at="0.6000000000000001"><path d="M704,170 q22,14 44,0" fill="none" stroke="#B8907A" stroke-width="1.1" stroke-dasharray="3 3"/><path d="M704,220 q22,10 44,0" fill="none" stroke="#B8907A" stroke-width="1.1" stroke-dasharray="3 3"/></g><g data-at="0.66"><text x="754" y="322" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="12" font-weight="600" fill="#1C2420" text-anchor="middle" letter-spacing="0">Усталый</text></g><g data-at="0.68"><text x="754" y="342" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">плоские щёки, западение</text></g><g data-at="0.68"><text x="754" y="357" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="middle" letter-spacing="0">под глазами, «серое» выражение</text></g><g data-at="0.72"><text x="40" y="372" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Чистых типов почти не бывает — обычно два-три признака сразу. Но ведущий признак существует, и он определяет, с чего начинать.</text></g></svg>