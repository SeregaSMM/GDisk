<svg viewBox="0 0 940 400" role="img" xmlns="http://www.w3.org/2000/svg"><defs><marker id="pcArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#D96B43"/></marker><marker id="pcArr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#5C7A66"/></marker></defs><g data-at="0.02"><text x="40" y="44" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">ЦЕПОЧКА, КОТОРУЮ ЗАПУСКАЕТ ПЛАЗМА</text></g><g data-at="0.04"><text x="40" y="66" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Плазма не «питает» кожу напрямую — она даёт сигнал клеткам, которые сами начинают работать.</text></g><g data-at="0.08"><rect x="44" y="150" width="190" height="116" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/></g><g data-at="0.1"><text x="60" y="176" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">1</text></g><g data-at="0.12"><text x="60" y="202" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="600" fill="#1C2420" text-anchor="start" letter-spacing="0">ТРОМБОЦИТ</text></g><g data-at="0.14"><text x="60" y="224" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">клетка крови,</text></g><g data-at="0.14"><text x="60" y="239" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">«аптечка» внутри</text></g><g data-at="0.16"><path d="M238,208.0 L254,208.0" stroke="#D96B43" stroke-width="1.6" marker-end="url(#pcArr)"/></g><g data-at="0.2"><rect x="260" y="150" width="190" height="116" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/></g><g data-at="0.22"><text x="276" y="176" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">2</text></g><g data-at="0.24000000000000002"><text x="276" y="202" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="600" fill="#1C2420" text-anchor="start" letter-spacing="0">ФАКТОРЫ РОСТА</text></g><g data-at="0.26"><text x="276" y="224" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">выделяются при</text></g><g data-at="0.26"><text x="276" y="239" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">активации</text></g><g data-at="0.28"><path d="M454,208.0 L470,208.0" stroke="#D96B43" stroke-width="1.6" marker-end="url(#pcArr)"/></g><g data-at="0.34"><rect x="476" y="150" width="190" height="116" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/></g><g data-at="0.36000000000000004"><text x="492" y="176" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">3</text></g><g data-at="0.38"><text x="492" y="202" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="600" fill="#1C2420" text-anchor="start" letter-spacing="0">ФИБРОБЛАСТ</text></g><g data-at="0.4"><text x="492" y="224" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">клетка, которая</text></g><g data-at="0.4"><text x="492" y="239" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">строит коллаген</text></g><g data-at="0.42000000000000004"><path d="M670,208.0 L686,208.0" stroke="#D96B43" stroke-width="1.6" marker-end="url(#pcArr)"/></g><g data-at="0.48"><rect x="692" y="150" width="190" height="116" rx="12" fill="#F2EFE9" stroke="#E6E1D6"/></g><g data-at="0.5"><text x="708" y="176" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">4</text></g><g data-at="0.52"><text x="708" y="202" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="600" fill="#1C2420" text-anchor="start" letter-spacing="0">НОВЫЙ КОЛЛАГЕН</text></g><g data-at="0.54"><text x="708" y="224" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">плотнее и</text></g><g data-at="0.54"><text x="708" y="239" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">эластичнее кожа</text></g><g data-at="0.56"><path d="M355.0,268 L355.0,312" stroke="#5C7A66" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#pcArr2)"/><text x="367.0" y="300" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#5C7A66" text-anchor="start" letter-spacing=".08em">и к сосудам: плотность капилляров</text></g><g data-at="0.62"><text x="40" y="306" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#5A655E" text-anchor="start" letter-spacing=".08em">ЧТО ЭТО ЗНАЧИТ ДЛЯ ПАЦИЕНТА</text></g><g data-at="0.64"><text x="40" y="328" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Эффект не мгновенный: клеткам нужно время, чтобы построить новый коллаген. Поэтому плазму не назначают «за неделю до события».</text></g><g data-at="0.68"><text x="40" y="348" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">И это же объясняет, почему результат накапливается курсом, а не с одного раза.</text></g></svg>