<svg viewBox="0 0 940 420" role="img" xmlns="http://www.w3.org/2000/svg"><defs></defs><g data-at="0.02"><text x="40" y="44" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">КАК РАБОТАЕТ ЭФФЕКТ ВО ВРЕМЕНИ</text></g><g data-at="0.04"><text x="40" y="66" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Красная линия — типичное ожидание. Зелёная — то, что обычно происходит.</text></g><line x1="90" y1="90" x2="90" y2="320" stroke="#E6E1D6" stroke-width="1.5"/><line x1="90" y1="320" x2="860" y2="320" stroke="#E6E1D6" stroke-width="1.5"/><g data-at="0.05"><line x1="90.0" y1="320" x2="90.0" y2="326" stroke="#E6E1D6"/><text x="90.0" y="342" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">0</text></g><g data-at="0.05"><line x1="282.5" y1="320" x2="282.5" y2="326" stroke="#E6E1D6"/><text x="282.5" y="342" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">1</text></g><g data-at="0.05"><line x1="475.0" y1="320" x2="475.0" y2="326" stroke="#E6E1D6"/><text x="475.0" y="342" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">3</text></g><g data-at="0.05"><line x1="667.5" y1="320" x2="667.5" y2="326" stroke="#E6E1D6"/><text x="667.5" y="342" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">6</text></g><g data-at="0.05"><line x1="860.0" y1="320" x2="860.0" y2="326" stroke="#E6E1D6"/><text x="860.0" y="342" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">12</text></g><g data-at="0.06"><text x="854" y="360" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#5A655E" text-anchor="end" letter-spacing=".08em">МЕСЯЦЫ</text></g><g data-at="0.06"><text x="76" y="90" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#5A655E" text-anchor="end" letter-spacing=".08em">ЭФФЕКТ</text></g><path d="M90,314 C240,260 410,108 860,96" fill="none" stroke="#B4553A" stroke-width="2.2" stroke-dasharray="6 5" data-at="0.12" data-draw="1" pathLength="100"/><g data-at="0.26"><text x="850" y="86" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="11" font-weight="600" fill="#B4553A" text-anchor="end" letter-spacing="0">ожидание</text></g><g data-at="0.28"><text x="850" y="104" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#B4553A" text-anchor="end" letter-spacing="0">«с каждым разом всё лучше»</text></g><path d="M90,316 C150,262 220,136 305,130 C420,122 510,280 860,296" fill="none" stroke="#5C7A66" stroke-width="2.6" data-at="0.16" data-draw="1" pathLength="100"/><g data-at="0.40"><text x="240" y="112" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="11" font-weight="600" fill="#5C7A66" text-anchor="start" letter-spacing="0">реальность</text></g><g data-at="0.46"><line x1="413.4" y1="320" x2="413.4" y2="134" stroke="#E6E1D6" stroke-dasharray="3 5"/><text x="423.4" y="100" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#5A655E" text-anchor="start" letter-spacing=".08em">ЗДЕСЬ ВИДЕН МАКСИМУМ</text></g><g data-at="0.50"><text x="423.4" y="116" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">оценивать эффект раньше — бессмысленно</text></g><g data-at="0.62"><text x="40" y="378" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Плазма не «подтягивает» лицо и не убирает гравитацию. Она улучшает качество кожи: плотность, ровность, мелкие линии.</text></g><g data-at="0.66"><text x="40" y="398" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Если ждать от неё эффекта подтяжки — разочарование гарантировано. Это разные задачи.</text></g></svg>