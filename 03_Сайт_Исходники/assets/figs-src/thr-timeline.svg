<svg viewBox="0 0 940 470" role="img" xmlns="http://www.w3.org/2000/svg"><defs></defs><g data-at="0.02"><text x="46" y="44" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">ТРИ ПРОЦЕССА ИДУТ ОДНОВРЕМЕННО</text></g><g data-at="0.04"><text x="46" y="66" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Нить работает не «сама по себе»: пока она рассасывается, ткань вокруг меняется.</text></g><g data-at="0.06"><line x1="170.0" y1="86" x2="170.0" y2="378" stroke="#E6E1D6" stroke-dasharray="3 5"/><text x="170.0" y="78" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">0</text></g><g data-at="0.06"><line x1="347.5" y1="86" x2="347.5" y2="378" stroke="#E6E1D6" stroke-dasharray="3 5"/><text x="347.5" y="78" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">3 мес</text></g><g data-at="0.06"><line x1="525.0" y1="86" x2="525.0" y2="378" stroke="#E6E1D6" stroke-dasharray="3 5"/><text x="525.0" y="78" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">6 мес</text></g><g data-at="0.06"><line x1="702.5" y1="86" x2="702.5" y2="378" stroke="#E6E1D6" stroke-dasharray="3 5"/><text x="702.5" y="78" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">12 мес</text></g><g data-at="0.06"><line x1="880.0" y1="86" x2="880.0" y2="378" stroke="#E6E1D6" stroke-dasharray="3 5"/><text x="880.0" y="78" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="9" font-weight="500" fill="#5A655E" text-anchor="middle" letter-spacing=".08em">18 мес</text></g><g data-at="0.1"><text x="46" y="130" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#234233" text-anchor="start" letter-spacing=".08em">МЕХАНИЧЕСКАЯ ПОДДЕРЖКА</text></g><g data-at="0.1"><text x="46" y="145" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">максимум сразу, дальше слабеет</text></g><path d="M170,158 C290,158 350,176 880,178" fill="none" stroke="#234233" stroke-width="2.4" data-at="0.16" data-draw="1" pathLength="100"/><g data-at="0.28"><text x="46" y="210" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#D96B43" text-anchor="start" letter-spacing=".08em">НОВЫЙ КОЛЛАГЕН</text></g><g data-at="0.28"><text x="46" y="225" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">растёт медленно, держится дольше</text></g><path d="M170,246 C290,224 430,228 880,240" fill="none" stroke="#D96B43" stroke-width="2.4" data-at="0.34" data-draw="1" pathLength="100"/><g data-at="0.42"><text x="46" y="290" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="8.5" font-weight="500" fill="#5A655E" text-anchor="start" letter-spacing=".08em">САМА НИТЬ</text></g><g data-at="0.42"><text x="46" y="305" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="9.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">постепенно растворяется</text></g><path d="M170,318 C370,322 470,340 880,350" fill="none" stroke="#5A655E" stroke-width="2.4" data-at="0.48" data-draw="1" pathLength="100"/><g data-at="0.60"><text x="46" y="366" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Практический смысл: первые недели лицо держит нить, а через полгода — уже собственная ткань, которая уплотнилась вокруг неё.</text></g><g data-at="0.64"><text x="46" y="386" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10.5" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Именно поэтому результат оценивают не через три дня, а через несколько месяцев.</text></g><g data-at="0.68"><text x="46" y="412" font-family="'Plus Jakarta Sans','DejaVu Sans',sans-serif" font-size="10" font-weight="400" fill="#5A655E" text-anchor="start" letter-spacing="0">Сроки на схеме — ориентир, а не гарантия: они зависят от материала, зоны и самой ткани.</text></g></svg>